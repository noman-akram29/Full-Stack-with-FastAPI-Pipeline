apiVersion: batch/v1
kind: Job
metadata:
  name: backend-prestart
  namespace: fastapi-app
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure

      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres -U pgadmin -d postgres; do
                sleep 2
              done
              echo "PostgreSQL is ready!"

      containers:
        - name: prestart
          image: nomanakram29/fastapi-backend:latest
          command: ["bash", "scripts/prestart.sh"]

          env:
            - name: POSTGRES_SERVER
              value: postgres

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: user

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

            - name: PROJECT_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: project_name

            - name: FIRST_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: first_superuser

            - name: FIRST_SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: first_superuser_password
